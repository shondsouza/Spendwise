<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline | SpendWise</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: system-ui, sans-serif;
      }
      .container {
        max-width: 520px;
        width: 100%;
        padding: 32px;
        text-align: center;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.08);
      }
      h1 { margin: 0 0 16px; font-size: clamp(2rem, 5vw, 3rem); }
      p { margin: 0 0 24px; color: #555; line-height: 1.6; }
      button {
        border: none;
        background: #007aff;
        color: white;
        border-radius: 999px;
        padding: 14px 24px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover { background: #0060d5; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Offline</h1>
        <p>It looks like you’re not connected to the internet. SpendWise is still available when you reconnect.</p>
        <button onclick="window.location.reload()">Retry</button>
      </div>
    </div>
  </body>
</html>
