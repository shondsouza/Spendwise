name: Weekly Database Backup

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export data via Supabase REST API
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups

          curl -s "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/expenses?select=*" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            > backups/expenses_$DATE.json

          curl -s "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/income?select=*" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            > backups/income_$DATE.json

          curl -s "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/budgets?select=*" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            > backups/budgets_$DATE.json

      - name: Upload backup as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-backup-${{ github.run_number }}
          path: backups/
          retention-days: 90
